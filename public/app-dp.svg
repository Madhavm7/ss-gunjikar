<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Border Ring Hologram Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="20%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="80%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Candlestick Green & Red Gradients -->
    <linearGradient id="candleGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="candleRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" />

  <!-- Outer Neon Trim -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.65" />
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.8" />

  <!-- Background Financial Matrix Grids & Chart Silhouette -->
  <g opacity="0.18">
    <line x1="80" y1="120" x2="432" y2="120" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <line x1="80" y1="180" x2="432" y2="180" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <line x1="80" y1="240" x2="432" y2="240" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <line x1="80" y1="300" x2="432" y2="300" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <line x1="80" y1="360" x2="432" y2="360" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />

    <line x1="140" y1="80" x2="140" y2="400" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <line x1="200" y1="80" x2="200" y2="400" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <line x1="260" y1="80" x2="260" y2="400" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <line x1="320" y1="80" x2="320" y2="400" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <line x1="380" y1="80" x2="380" y2="400" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5" />
  </g>

  <!-- Ambient Neon Radial Glow behind Logo -->
  <circle cx="256" cy="245" r="140" fill="#4f46e5" opacity="0.32" filter="url(#neonGlow)" />
  <circle cx="256" cy="245" r="85" fill="#06b6d4" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Decorative Candlesticks Behind -->
  <g opacity="0.5">
    <!-- Green Candle 1 -->
    <line x1="110" y1="200" x2="110" y2="340" stroke="#10b981" stroke-width="2" />
    <rect x="103" y="230" width="14" height="70" rx="3" fill="url(#candleGreen)" />

    <!-- Red Candle 2 -->
    <line x1="145" y1="180" x2="145" y2="320" stroke="#ef4444" stroke-width="2" />
    <rect x="138" y="200" width="14" height="85" rx="3" fill="url(#candleRed)" />

    <!-- Green Candle 3 -->
    <line x1="365" y1="190" x2="365" y2="330" stroke="#10b981" stroke-width="2" />
    <rect x="358" y="210" width="14" height="80" rx="3" fill="url(#candleGreen)" />

    <!-- Green Candle 4 -->
    <line x1="400" y1="150" x2="400" y2="300" stroke="#10b981" stroke-width="2" />
    <rect x="393" y="170" width="14" height="95" rx="3" fill="url(#candleGreen)" />
  </g>

  <!-- Holographic Rising Trend Wave -->
  <path d="M 70 340 Q 150 320 220 280 T 360 210 T 440 140" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.4" filter="url(#subtleGlow)" />

  <!-- Centerpiece: 3D Holographic GREEK OMEGA (Ω) & BULL HORNS LOGO -->
  <!-- Shadow of Omega -->
  <path d="M 180 340 L 135 340 C 126 340 120 332 120 322 C 120 312 128 304 138 304 L 176 304 C 160 270 152 235 156 195 C 164 140 205 96 260 92 C 322 88 372 136 372 198 C 372 237 358 272 336 304 L 374 304 C 384 304 392 312 392 322 C 392 332 386 340 377 340 L 332 340 C 318 340 308 329 308 315 C 326 288 338 252 338 214 C 338 165 299 126 250 126 C 201 126 162 165 162 214 C 162 252 174 288 192 315 C 192 329 182 340 180 340 Z" fill="#030712" opacity="0.6" transform="translate(0, 10)" />

  <!-- Outer Glow of Omega -->
  <path d="M 180 330 L 135 330 C 126 330 120 322 120 312 C 120 302 128 294 138 294 L 176 294 C 160 260 152 225 156 185 C 164 130 205 86 260 82 C 322 78 372 126 372 188 C 372 227 358 262 336 294 L 374 294 C 384 294 392 302 392 312 C 392 322 386 330 377 330 L 332 330 C 318 330 308 319 308 305 C 326 278 338 242 338 204 C 338 155 299 116 250 116 C 201 116 162 155 162 204 C 162 242 174 278 192 305 C 192 319 182 330 180 330 Z" fill="none" stroke="#6366f1" stroke-width="12" opacity="0.5" filter="url(#neonGlow)" />

  <!-- Main Metallic Gold Omega with Bevel & Bull Accents -->
  <path d="M 180 330 L 135 330 C 126 330 120 322 120 312 C 120 302 128 294 138 294 L 176 294 C 160 260 152 225 156 185 C 164 130 205 86 260 82 C 322 78 372 126 372 188 C 372 227 358 262 336 294 L 374 294 C 384 294 392 302 392 312 C 392 322 386 330 377 330 L 332 330 C 318 330 308 319 308 305 C 326 278 338 242 338 204 C 338 155 299 116 250 116 C 201 116 162 155 162 204 C 162 242 174 278 192 305 C 192 319 182 330 180 330 Z" fill="url(#goldGrad)" />

  <!-- Inner Core Cutout with Cyan Glow -->
  <circle cx="256" cy="204" r="54" fill="#090d16" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#subtleGlow)" />

  <!-- Delta / Strike Crosshair in Center -->
  <g transform="translate(256, 204)">
    <polygon points="0,-24 20,16 -20,16" fill="url(#cyanGrad)" opacity="0.9" />
    <circle cx="0" cy="4" r="5" fill="#ffffff" />
  </g>

  <!-- Specular Light Highlights on Omega Top Arc -->
  <path d="M 195 140 C 215 118 238 108 265 106 C 290 106 312 114 330 130" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#subtleGlow)" />

  <!-- Bull Horn Accent Tips (Futuristic Gold) -->
  <path d="M 156 150 C 130 120 120 70 140 50 C 150 75 168 110 180 135 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M 356 150 C 382 120 392 70 372 50 C 362 75 344 110 332 135 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Brand Banner at Bottom -->
  <rect x="136" y="385" width="240" height="42" rx="12" fill="#090d1a" stroke="url(#cyanGrad)" stroke-width="2" />
  <text x="256" y="411" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="3.5" text-anchor="middle">
    OPTICHAIN
  </text>
  <text x="256" y="423" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38bdf8" letter-spacing="2" text-anchor="middle">
    PRO DERIVATIVES
  </text>

  <!-- Live Pulse Dot in Top Right Corner -->
  <circle cx="440" cy="72" r="10" fill="#10b981" opacity="0.3" filter="url(#neonGlow)" />
  <circle cx="440" cy="72" r="6" fill="#34d399" />
  <circle cx="440" cy="72" r="3" fill="#ffffff" />
</svg>
